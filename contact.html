<div class="container">
    <h1>Contact Me</h1>

    <p style="text-align:center; font-size:17px; margin-bottom:25px;">
        If you have any questions, opportunities, or would like to collaborate,
        feel free to reach out to me. I will respond as soon as possible!
    </p>

    <form>
        <label>Name</label>
        <input type="text" placeholder="Enter your full name">

        <label>Email</label>
        <input type="email" placeholder="Enter your email address">

        <label>Subject</label>
        <input type="text" placeholder="What is your message about?">

        <label>Message</label>
        <textarea rows="5" placeholder="Write your message here..."></textarea>

        <button type="submit">Send Message</button>
    </form>
</div>

</body>
